# Example CI workflow for running playdate-e2e tests on GitHub Actions.
# Copy this into your game project and adjust the build steps for your game.
#
# Requirements:
#   - PLAYDATE_SDK_PATH is set by setup-playdate-sdk
#   - Your game must compile with pdk_e2e linked (simulator builds only)
#
# Platform notes:
#   - macOS: works out of the box (emulated display server on GitHub runners)
#   - Linux: blocked — simulator hangs under xvfb, no headless mode exists
#   - Windows: likely works but less community-tested

name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pd-rs/get-playdate-sdk@main

      # Suppress the email signup popup that blocks unattended simulator runs
      - name: Configure simulator for CI
        run: defaults write date.play.simulator elistShown -bool YES

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build test runner
        run: pnpm build

      - name: Build game (with pdk_e2e)
        run: make

      - name: Run e2e tests
        run: pnpm vitest run e2e/
